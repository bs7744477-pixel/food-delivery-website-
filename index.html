<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANJEEV - Food Delivery</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f7f7f7;
  color: #222;
  transition: 0.3s;
}

/* DARK MODE */

body.dark-mode {
  background: #121212;
  color: white;
}

body.dark-mode header,
body.dark-mode .food,
body.dark-mode .cart,
body.dark-mode .search,
body.dark-mode .categories,
body.dark-mode .track-section,
body.dark-mode .modal,
body.dark-mode .profile-bar,
body.dark-mode .profile-dropdown {
  background: #222;
  color: white;
}

body.dark-mode p,
body.dark-mode h2,
body.dark-mode h3 {
  color: white;
}

body.dark-mode input {
  background: #333;
  color: white;
  border: 1px solid #555;
}

body.dark-mode .categories button {
  background: #333;
  color: white;
}

body.dark-mode .categories button.active {
  background: #e23744;
  color: white;
}

body.dark-mode footer {
  background: #000;
  color: white;
}

body.dark-mode .food p {
  color: #bbb;
}

body.dark-mode .profile-dropdown button {
  color: white;
}

body.dark-mode .profile-dropdown button:hover {
  background: #333;
}

/* HEADER */

header {
  background: #e23744;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 6px;
}

button {
  cursor: pointer;
}

/* THEME BUTTON */

#themeToggle {
  padding: 10px 18px;
  margin: 10px;
  border: none;
  border-radius: 20px;
  background: #222;
  color: white;
}

/* LOCATION */

#locationButton {
  padding: 10px 18px;
  margin: 10px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #e23744;
}

#locationText {
  margin: 10px;
  word-wrap: break-word;
}

/* PROFILE */

.profile-container {
  position: relative;
  display: inline-block;
  margin-top: 15px;
}

.profile-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 15px;
  background: white;
  color: #222;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 2px 8px #0002;
}

.profile-avatar {
  width: 40px;
  height: 40px;
  background: #e23744;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.profile-info {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.profile-info span {
  font-weight: bold;
}

.profile-info small {
  font-size: 12px;
  color: gray;
}

.dropdown-arrow {
  margin-left: 10px;
  font-size: 12px;
}

.profile-dropdown {
  display: none;
  position: absolute;
  right: 0;
  top: 110%;
  width: 220px;
  background: white;
  color: #222;
  border-radius: 12px;
  box-shadow: 0 5px 20px #0003;
  z-index: 2000;
  overflow: hidden;
  text-align: left;
}

.profile-dropdown.show {
  display: block;
}

.profile-dropdown button {
  width: 100%;
  padding: 14px;
  border: none;
  background: transparent;
  color: #222;
  text-align: left;
  font-size: 15px;
}

.profile-dropdown button:hover {
  background: #f2f2f2;
}

.logout-option {
  color: #e23744 !important;
  border-top: 1px solid #eee !important;
}

/* AUTH BUTTONS */

#authButtons {
  margin-top: 15px;
}

#loginButton,
#signupButton {
  padding: 10px 20px;
  margin: 5px;
  border: none;
  border-radius: 5px;
}

/* SEARCH */

.search {
  padding: 20px;
  text-align: center;
}

.search input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

/* CATEGORIES */

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 15px;
}

.categories button {
  padding: 11px 17px;
  border: none;
  border-radius: 20px;
  background: white;
  white-space: nowrap;
}

.categories button.active {
  background: #e23744;
  color: white;
}

/* FOOD */

h2 {
  margin: 20px;
}

.food-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  padding: 15px;
}

.food {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px #ddd;
}

.food img {
  width: 100%;
  height: 125px;
  object-fit: cover;
}

.food-info {
  padding: 12px;
}

.food h3 {
  font-size: 16px;
}

.food p {
  color: #666;
  margin: 8px 0;
  font-size: 13px;
}

.price {
  color: #e23744;
  font-weight: bold;
}

.food button,
.checkout {
  width: 100%;
  padding: 10px;
  border: none;
  background: #e23744;
  color: white;
  border-radius: 7px;
  margin-top: 10px;
}

/* CART */

.cart {
  background: white;
  margin: 15px;
  padding: 18px;
  border-radius: 12px;
}

.cart p {
  margin: 10px 0;
}

/* TRACK ORDER */

.track-section {
  background: white;
  padding: 25px;
  margin: 20px;
  border-radius: 15px;
}

.track-section input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

.track-section button {
  width: 100%;
  padding: 12px;
  background: #e23744;
  color: white;
  border: none;
  border-radius: 8px;
}

/* MODALS */

.modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 85%;
  max-width: 350px;
  box-shadow: 0 0 20px #999;
  z-index: 1000;
}

.modal h2 {
  color: #e23744;
  margin: 0 0 15px;
}

.modal input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

.modal button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}

.formButton {
  background: #e23744;
  color: white;
}

.closeButton {
  background: #ddd;
  color: black;
}

/* FOOTER */

footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 30px;
}

/* MOBILE */

@media (max-width: 400px) {

  .food-list {
    grid-template-columns: 1fr;
  }

  .profile-dropdown {
    width: 200px;
  }

}

</style>
</head>

<body>

  <h1>SANJEEV</h1>
  <p>Delicious Food, Delivered To You!</p>

  <button id="themeToggle">
    🌙 Dark Mode
  </button>

  <button id="locationButton" onclick="getLocation()">
    📍 My Location

<!-- FOOD WEBSITE SCRIPT -->

<script>

const foods = [

  {
    name: "Chicken Biryani",
    category: "Biryani",
    price: 160,
    image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=500"
  },

  {
    name: "Veg Biryani",
    category: "Biryani",
    price: 120,
    image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=500"
  },

  {
    name: "Cheese Pizza",
    category: "Pizza",
    price: 199,
    image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"
  },

  {
    name: "Burger",
    category: "Burger",
    price: 99,
    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
  },

  {
    name: "Masala Dosa",
    category: "Dosa",
    price: 70,
    image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=500"
  },

  {
    name: "Paneer Pizza",
    category: "Pizza",
    price: 179,
    image: "https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?w=500"
  }

];

let selected = "All";
let cart = [];

/* DISPLAY FOOD */

function showFoods() {

  const search = document
    .getElementById("search")
    .value.toLowerCase();

  const filtered = foods.filter(food =>

    (selected === "All" ||
      food.category === selected) &&

    food.name.toLowerCase().includes(search)

  );

  document.getElementById("foodList").innerHTML =

    filtered.map(food => `

      <div class="food">

        <img src="${food.image}" alt="${food.name}">

        <div class="food-info">

          <h3>${food.name}</h3>

          <p>${food.category}</p>

          <div class="price">₹${food.price}</div>

          <button onclick="addCart('${food.name}')">
            Add to Cart +
          </button>

        </div>

      </div>

    `).join("") || "<p>No food found.</p>";

}

/* FILTER FOOD */

function filterFood(category, button) {

  selected = category;

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  showFoods();

}

/* ADD TO CART */

function addCart(name) {

  const food = foods.find(item => item.name === name);

  if (food) {

    cart.push(food);

    updateCart();

  }

}

/* UPDATE CART */

function updateCart() {

  let total = 0;

  document.getElementById("cartItems").innerHTML =

    cart.length

      ? cart.map(food => {

          total += food.price;

          return `<p>${food.name} - ₹${food.price}</p>`;

        }).join("")

      : "Your cart is empty.";

  document.getElementById("total").textContent = total;

}
/* CHECKOUT WITH OTP */

function checkout() {

  if (!cart.length) {
    alert("Please add food to your cart first!");
    return;
  }

  const name = prompt("Enter your full name:");

  if (!name || !name.trim()) return;

  const address = prompt("Enter your delivery address:");

  if (!address || !address.trim()) return;

  window.pendingOrder = {
    name: name.trim(),
    address: address.trim(),
    total: cart.reduce((sum, food) => sum + food.price, 0),
    items: cart.map(food => food.name)
  };

  document.getElementById("otpForm").style.display = "block";

}
  /* COMPLETE ORDER AFTER OTP */

window.completeCheckout = function(phone) {

  const order = window.pendingOrder;

  if (!order) return;

  alert(
    "ORDER CONFIRMED!\n\n" +
    "Name: " + order.name +
    "\nPhone: " + phone +
    "\nAddress: " + order.address +
    "\nItems: " + order.items.join(", ") +
    "\nTotal: ₹" + order.total
  );

  cart = [];

  updateCart();

  window.pendingOrder = null;

  document.getElementById("otpForm").style.display = "none";

  document.getElementById("otpSection").style.display = "none";

  document.getElementById("otpPhone").value = "";

  document.getElementById("otpCode").value = "";

};


showFoods();

</script>

<!-- LOGIN AND SIGNUP FORM CONTROL -->

<script>

function openForm(type) {

  document.getElementById("loginForm").style.display = "none";

  document.getElementById("signupForm").style.display = "none";

  if (type === "login") {

    document.getElementById("loginForm").style.display = "block";

  } else {

    document.getElementById("signupForm").style.display = "block";

  }

}

function closeForm() {

  document.getElementById("loginForm").style.display = "none";

  document.getElementById("signupForm").style.display = "none";

}

</script>

<!-- PROFILE DROPDOWN -->

<script>

function toggleProfileMenu() {

  document.getElementById("profileDropdown")
    .classList.toggle("show");

}

/* CLOSE MENU WHEN CLICKING OUTSIDE */

document.addEventListener("click", function(event) {

  const container = document.querySelector(".profile-container");

  if (container && !container.contains(event.target)) {

    document.getElementById("profileDropdown")
      .classList.remove("show");

  }

});

/* PROFILE MENU OPTIONS */

function showProfile() {

  alert("My Profile");

}

function showOrders() {

  alert("My Orders");

}

function showAddresses() {

  alert("Saved Addresses");

}

function showFavorites() {

  alert("My Favorites");

}

function showSettings() {

  alert("Settings");

}

</script>

<!-- ORDER TRACKING -->

<script>

function trackOrder() {

  const id = document
    .getElementById("orderId")
    .value.trim();

  if (!id) {

    alert("Please enter your Order ID");

    return;

  }

  const result = document.getElementById("trackingResult");

  result.innerHTML = `

    <h3>Order: ${id.replace(/[<>&"]/g, "")}</h3>

    <p>✅ Order Placed</p>

    <p>✅ Food Preparing</p>

    <p>🛵 Out for Delivery</p>

    <p>⏳ Delivered</p>

    <h3 style="color:#e23744;">
      Your food is on the way!
    </h3>

  `;

}

</script>

<!-- FIREBASE AUTHENTICATION -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {

  getAuth,

  createUserWithEmailAndPassword,

  signInWithEmailAndPassword,

  updateProfile,

  sendEmailVerification,

  onAuthStateChanged,

  signOut,

  RecaptchaVerifier,

  signInWithPhoneNumber

}

from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

/* FIREBASE CONFIGURATION */

const firebaseConfig = {

  apiKey: "AIzaSyDhXSgQr-f6is4IIDmP7uljj1bg9okurBU",

  authDomain: "sanjeev-food-delivery.firebaseapp.com",

  projectId: "sanjeev-food-delivery",

  storageBucket: "sanjeev-food-delivery.firebasestorage.app",

  messagingSenderId: "580683471077",

  appId: "1:580683471077:web:6372c35fff3b75fc56dc0c"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
  /* SECOND FIREBASE AUTH FOR PHONE OTP */

const phoneApp = initializeApp(firebaseConfig, "PhoneOTP");

const phoneAuth = getAuth(phoneApp);

let recaptchaVerifier;

let confirmationResult;

/* SIGNUP WITH EMAIL VERIFICATION */

document.getElementById("signupBtn")
  .addEventListener("click", async () => {

    const name = document
      .getElementById("signupName")
      .value.trim();

    const email = document
      .getElementById("signupEmail")
      .value.trim();

    const password = document
      .getElementById("signupPassword")
      .value;

    if (!name || !email || !password) {

      alert("Please fill all fields.");

      return;

    }

    if (password.length < 6) {

      alert("Password must be at least 6 characters.");

      return;

    }

    try {

      const userCredential =
        await createUserWithEmailAndPassword(
          auth, email, password
        );

      const user = userCredential.user;

      await updateProfile(user, {

        displayName: name

      });

      /* SEND VERIFICATION EMAIL */

      await sendEmailVerification(user);

      /* SIGN OUT UNTIL VERIFIED */

      await signOut(auth);

      closeForm();

      alert(
        "Account created successfully!\n\n" +
        "A verification email has been sent to " + email +
        "\n\nPlease open your email and click the verification link before logging in."
      );

    } catch (error) {

      alert("Signup Error: " + error.message);

    }

  });

/* LOGIN WITH EMAIL VERIFICATION */

document.getElementById("loginBtn")
  .addEventListener("click", async () => {

    const email = document
      .getElementById("loginEmail")
      .value.trim();

    const password = document
      .getElementById("loginPassword")
      .value;

    if (!email || !password) {

      alert("Please enter email and password.");

      return;

    }

    try {

      const userCredential =
        await signInWithEmailAndPassword(
          auth, email, password
        );

      const user = userCredential.user;

      /* CHECK EMAIL VERIFICATION */

      if (!user.emailVerified) {

        await sendEmailVerification(user);

        await signOut(auth);

        alert(
          "Your email is not verified!\n\n" +
          "A new verification email has been sent to " + email +
          "\n\nPlease verify your email before logging in."
        );

        return;

      }

      alert("Login successful!");

      closeForm();

    } catch (error) {

      alert("Login Error: " + error.message);

    }

  });

/* LOGOUT */

document.getElementById("dropdownLogout")
  .addEventListener("click", async () => {

    try {

      await signOut(auth);

      document.getElementById("profileDropdown")
        .classList.remove("show");

      alert("Logged out successfully!");

    } catch (error) {

      alert("Logout Error: " + error.message);

    }

  });

/* AUTH STATUS */

onAuthStateChanged(auth, async (user) => {

  const profileBar =
    document.getElementById("profileBar");

  const profileName =
    document.getElementById("profileName");

  const profileEmail =
    document.getElementById("profileEmail");

  const authButtons =
    document.getElementById("authButtons");

  const dropdown =
    document.getElementById("profileDropdown");

  const welcome =
    document.getElementById("userWelcome");

  /* BLOCK UNVERIFIED USERS */

  if (user && !user.emailVerified) {

    await signOut(auth);

    return;

  }

  if (user) {

    profileBar.style.display = "flex";

    profileName.textContent =
      user.displayName || "User";

    profileEmail.textContent =
      user.email || "";

    authButtons.style.display = "none";

    welcome.textContent =
      "Welcome, " + (user.displayName || user.email) + "!";

  } else {

    profileBar.style.display = "none";

    authButtons.style.display = "block";

    dropdown.classList.remove("show");

    welcome.textContent = "";

  }

});
  /* SEND SMS OTP */

document.getElementById("sendOtpBtn")
  .addEventListener("click", async () => {

    let phone = document
      .getElementById("otpPhone")
      .value.trim();

    if (/^[6-9]\d{9}$/.test(phone)) {
      phone = "+91" + phone;
    }

    if (!/^\+91[6-9]\d{9}$/.test(phone)) {

      alert("Enter a valid Indian mobile number.");

      return;

    }

    try {

      if (!recaptchaVerifier) {

        recaptchaVerifier = new RecaptchaVerifier(
          phoneAuth,
          "recaptcha-container",
          {
            size: "normal"
          }
        );

      }

      confirmationResult = await signInWithPhoneNumber(
        phoneAuth,
        phone,
        recaptchaVerifier
      );

      document.getElementById("otpSection")
        .style.display = "block";

      alert("OTP sent successfully to " + phone);

    } catch (error) {

      alert("SMS Error: " + error.message);

      if (recaptchaVerifier) {

        recaptchaVerifier.clear();

        recaptchaVerifier = null;

      }

    }

  });


/* VERIFY SMS OTP */

document.getElementById("verifyOtpBtn")
  .addEventListener("click", async () => {

    const otp = document
      .getElementById("otpCode")
      .value.trim();

    if (!/^\d{6}$/.test(otp)) {

      alert("Enter a valid 6-digit OTP.");

      return;

    }

    try {

      const result = await confirmationResult.confirm(otp);

      const phone = result.user.phoneNumber;

      alert("Phone number verified successfully!");

      await signOut(phoneAuth);

      window.completeCheckout(phone);

    } catch (error) {

      alert("Invalid OTP. Please try again.");

    }

  });


/* CLOSE OTP FORM */

window.closeOtpForm = function() {

  document.getElementById("otpForm").style.display = "none";

};

</script>

<script>

document.addEventListener("DOMContentLoaded", function() {

  const themeButton = document.getElementById("themeToggle");

  if (!themeButton) return;

  function applyTheme(isDark) {

    if (isDark) {

      document.body.classList.add("dark-mode");

      themeButton.innerHTML = "☀️ Light Mode";

      localStorage.setItem("theme", "dark");

    } else {

      document.body.classList.remove("dark-mode");

      themeButton.innerHTML = "🌙 Dark Mode";

      localStorage.setItem("theme", "light");

    }

  }

  // Load saved theme
  const savedTheme = localStorage.getItem("theme");

  applyTheme(savedTheme === "dark");

  // DARK MODE

document.addEventListener("DOMContentLoaded", function() {

  const themeButton = document.getElementById("themeToggle");

  function applyTheme(isDark) {

    if (isDark) {
      document.body.classList.add("dark-mode");
      themeButton.innerHTML = "☀️ Light Mode";
    } else {
      document.body.classList.remove("dark-mode");
      themeButton.innerHTML = "🌙 Dark Mode";
    }

  }

  themeButton.addEventListener("click", function() {

    const isDark = document.body.classList.contains("dark-mode");

    applyTheme(!isDark);

  });

});


// LOCATION

function getLocation() {

  const locationText = document.getElementById("locationText");

  locationText.innerHTML = "📍 Detecting location...";

  if (!navigator.geolocation) {
    locationText.innerHTML = "Location not supported.";
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      locationText.innerHTML =
        "📍 Location detected successfully!<br>" +
        "Latitude: " + position.coords.latitude + "<br>" +
        "Longitude: " + position.coords.longitude;

    },

    function() {

      locationText.innerHTML =
        "❌ Unable to detect location.";

    }

  );

}

</script>
