<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANJEEV - Food Delivery</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f7f7f7;
  color: #222;
  transition: 0.3s;
}

/* DARK MODE */
body.dark-mode {
  background: #121212;
  color: white;
}

body.dark-mode header,
body.dark-mode .food,
body.dark-mode .cart,
body.dark-mode .search,
body.dark-mode .categories,
body.dark-mode .track-section,
body.dark-mode .modal {
  background: #222;
  color: white;
}

body.dark-mode p,
body.dark-mode h2,
body.dark-mode h3 {
  color: white;
}

body.dark-mode input {
  background: #333;
  color: white;
  border: 1px solid #555;
}

body.dark-mode .categories button {
  background: #333;
  color: white;
}

body.dark-mode footer {
  background: #000;
  color: white;
}

body.dark-mode .food p {
  color: #bbb;
}

header {
  background: #e23744;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 6px;
}

button {
  cursor: pointer;
}

#themeToggle {
  padding: 10px 18px;
  margin: 10px;
  border: none;
  border-radius: 20px;
  background: #222;
  color: white;
}

#locationButton {
  padding: 10px 18px;
  margin: 10px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #e23744;
}

#locationText {
  margin: 10px;
  word-wrap: break-word;
}

.search {
  padding: 20px;
  text-align: center;
}

.search input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 15px;
}

.categories button {
  padding: 11px 17px;
  border: none;
  border-radius: 20px;
  background: white;
  white-space: nowrap;
}

.categories button.active {
  background: #e23744;
  color: white;
}

h2 {
  margin: 20px;
}

.food-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  padding: 15px;
}

.food {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px #ddd;
}

.food img {
  width: 100%;
  height: 125px;
  object-fit: cover;
}

.food-info {
  padding: 12px;
}

.food h3 {
  font-size: 16px;
}

.food p {
  color: #666;
  margin: 8px 0;
  font-size: 13px;
}

.price {
  color: #e23744;
  font-weight: bold;
}

.food button,
.checkout {
  width: 100%;
  padding: 10px;
  border: none;
  background: #e23744;
  color: white;
  border-radius: 7px;
  margin-top: 10px;
}

.cart {
  background: white;
  margin: 15px;
  padding: 18px;
  border-radius: 12px;
}

.cart p {
  margin: 10px 0;
}

footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 30px;
}

.track-section {
  background: white;
  padding: 25px;
  margin: 20px;
  border-radius: 15px;
}

.track-section input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

.track-section button {
  width: 100%;
  padding: 12px;
  background: #e23744;
  color: white;
  border: none;
  border-radius: 8px;
}

/* LOGIN & SIGNUP */
.modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 85%;
  max-width: 350px;
  box-shadow: 0 0 20px #999;
  z-index: 1000;
}

.modal h2 {
  color: #e23744;
  margin: 0 0 15px;
}

.modal input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

.modal button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}

.formButton {
  background: #e23744;
  color: white;
}

.closeButton {
  background: #ddd;
  color: black;
}

/* MOBILE */
@media (max-width: 400px) {
  .food-list {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>

  <h1>SANJEEV</h1>
  <p>Delicious Food, Delivered To You!</p>

  <button id="themeToggle">
    🌙 Dark Mode
  </button>

  <button id="locationButton" onclick="getLocation()">
    📍 My Location
  </button>

  <p id="locationText"></p>

  <p id="userWelcome" style="margin-top:10px;font-weight:bold;"></p>

  <div style="margin-top:15px;">

    <button id="loginButton"
    onclick="openForm('login')"
    style="padding:10px 20px;margin:5px;border:none;border-radius:5px;background:white;color:#e23744;">
      Login
    </button>

    <button id="signupButton"
    onclick="openForm('signup')"
    style="padding:10px 20px;margin:5px;border:none;border-radius:5px;background:#222;color:white;">
      Signup
    </button>

    <button id="logoutButton"
    style="display:none;padding:10px 20px;margin:5px;border:none;border-radius:5px;background:#222;color:white;">
      Logout
    </button>

  </div>

</header>

<section class="search">

  <input id="search"
  type="text"
  placeholder="Search your favourite food..."
  oninput="showFoods()">

</section>

<div class="categories">

  <button class="active" onclick="filterFood('All',this)">All</button>
  <button onclick="filterFood('Biryani',this)">Biryani</button>
  <button onclick="filterFood('Pizza',this)">Pizza</button>
  <button onclick="filterFood('Burger',this)">Burger</button>
  <button onclick="filterFood('Dosa',this)">Dosa</button>

</div>

<h2>Popular Food</h2>

<div class="food-list" id="foodList"></div>

<section class="cart">

  <h2>🛒 Your Cart</h2>

  <div id="cartItems">Your cart is empty.</div>

  <p>Total: ₹<span id="total">0</span></p>

  <button class="checkout" onclick="checkout()">
    Place Order
  </button>

</section>

<!-- LOGIN FORM -->

<div id="loginForm" class="modal">

  <h2>Login</h2>

  <input type="email" id="loginEmail" placeholder="Email">

  <input type="password" id="loginPassword" placeholder="Password">

  <button id="loginBtn" class="formButton">
    Login
  </button>

  <button onclick="closeForm()" class="closeButton">
    Close
  </button>

</div>

<!-- SIGNUP FORM -->

<div id="signupForm" class="modal">

  <h2>Signup</h2>

  <input type="text" id="signupName" placeholder="Full Name">

  <input type="email" id="signupEmail" placeholder="Email">

  <input type="password" id="signupPassword" placeholder="Password">

  <button id="signupBtn" class="formButton">
    Create Account
  </button>

  <button onclick="closeForm()" class="closeButton">
    Cancel
  </button>

</div>

<!-- ORDER TRACKING -->

<section class="track-section">

  <h2 style="color:#e23744;text-align:center;">
    Track Your Order 🚚
  </h2>

  <input type="text" id="orderId" placeholder="Enter Order ID">

  <button onclick="trackOrder()">
    Track Order
  </button>

  <div id="trackingResult" style="margin-top:20px;"></div>

</section>

<footer>

  <h3>SANJEEV</h3>
  <p>Food Delivery Website</p>
  <p>© 2026 SANJEEV. All rights reserved.</p>

</footer>

<!-- FOOD WEBSITE SCRIPT -->

<script>

const foods = [
  {
    name: "Chicken Biryani",
    category: "Biryani",
    price: 160,
    image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=500"
  },
  {
    name: "Veg Biryani",
    category: "Biryani",
    price: 120,
    image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=500"
  },
  {
    name: "Cheese Pizza",
    category: "Pizza",
    price: 199,
    image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"
  },
  {
    name: "Burger",
    category: "Burger",
    price: 99,
    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
  },
  {
    name: "Masala Dosa",
    category: "Dosa",
    price: 70,
    image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=500"
  },
  {
    name: "Paneer Pizza",
    category: "Pizza",
    price: 179,
    image: "https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?w=500"
  }
];

let selected = "All";
let cart = [];

function showFoods() {

  const search = document.getElementById("search").value.toLowerCase();

  const filtered = foods.filter(food =>
    (selected === "All" || food.category === selected) &&
    food.name.toLowerCase().includes(search)
  );

  document.getElementById("foodList").innerHTML =
    filtered.map(food => `
      <div class="food">

        <img src="${food.image}" alt="${food.name}">

        <div class="food-info">

          <h3>${food.name}</h3>
          <p>${food.category}</p>

          <div class="price">₹${food.price}</div>

          <button onclick="addCart('${food.name}')">
            Add to Cart +
          </button>

        </div>

      </div>
    `).join("") || "<p>No food found.</p>";

}

function filterFood(category, button) {

  selected = category;

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  showFoods();

}

function addCart(name) {

  const food = foods.find(item => item.name === name);

  if (food) {
    cart.push(food);
    updateCart();
  }

}

function updateCart() {

  let total = 0;

  document.getElementById("cartItems").innerHTML =
    cart.length
      ? cart.map(food => {
          total += food.price;
          return `<p>${food.name} - ₹${food.price}</p>`;
        }).join("")
      : "Your cart is empty.";

  document.getElementById("total").textContent = total;

}

function checkout() {

  if (!cart.length) {
    alert("Please add food to your cart first!");
    return;
  }

  const name = prompt("Enter your full name:");

  if (!name || !name.trim()) return;

  const phone = prompt("Enter your 10-digit mobile number:");

  if (!phone || !/^[6-9]\d{9}$/.test(phone.trim())) {
    alert("Enter a valid mobile number.");
    return;
  }

  const address = prompt("Enter your delivery address:");

  if (!address || !address.trim()) return;

  const total = cart.reduce(
    (sum, food) => sum + food.price, 0
  );

  const confirmed = confirm(
    "SANJEEV ORDER\n\n" +
    "Name: " + name +
    "\nPhone: " + phone +
    "\nAddress: " + address +
    "\nTotal: Rs." + total +
    "\n\nConfirm order?"
  );

  if (confirmed) {

    alert("Thank you " + name + "! Demo order confirmed.");

    cart = [];
    updateCart();

  }

}

showFoods();

</script>

<!-- LOGIN AND SIGNUP FORM CONTROL -->

<script>

function openForm(type) {

  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "none";

  if (type === "login") {
    document.getElementById("loginForm").style.display = "block";
  } else {
    document.getElementById("signupForm").style.display = "block";
  }

}

function closeForm() {

  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "none";

}

</script>

<!-- ORDER TRACKING -->

<script>

function trackOrder() {

  const id = document.getElementById("orderId").value.trim();

  if (!id) {
    alert("Please enter your Order ID");
    return;
  }

  const result = document.getElementById("trackingResult");

  result.innerHTML = `
    <h3>Order: ${id.replace(/[<>&"]/g, "")}</h3>
    <p>✅ Order Placed</p>
    <p>✅ Food Preparing</p>
    <p>🛵 Out for Delivery</p>
    <p>⏳ Delivered</p>
    <h3 style="color:#e23744;">
      Your food is on the way!
    </h3>
  `;

}

</script>

<!-- FIREBASE AUTHENTICATION -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhXSgQr-f6is4IIDmP7uljj1bg9okurBU",
  authDomain: "sanjeev-food-delivery.firebaseapp.com",
  projectId: "sanjeev-food-delivery",
  storageBucket: "sanjeev-food-delivery.firebasestorage.app",
  messagingSenderId: "580683471077",
  appId: "1:580683471077:web:6372c35fff3b75fc56dc0c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* SIGNUP */

document.getElementById("signupBtn").addEventListener("click", async () => {

  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  if (!name || !email || !password) {
    alert("Please fill all fields.");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  try {

    const userCredential = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await updateProfile(userCredential.user, {
      displayName: name
    });

    alert("Account created successfully!");

    closeForm();

  } catch (error) {

    alert("Signup Error: " + error.message);

  }

});

/* LOGIN */

document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    alert("Please enter email and password.");
    return;
  }

  try {

    await signInWithEmailAndPassword(auth, email, password);

    alert("Login successful!");

    closeForm();

  } catch (error) {

    alert("Login Error: " + error.message);

  }

});

/* LOGOUT */

document.getElementById("logoutButton").addEventListener("click", async () => {

  try {

    await signOut(auth);
    alert("Logged out successfully!");

  } catch (error) {

    alert(error.message);

  }

});

/* AUTH STATUS */

onAuthStateChanged(auth, (user) => {

  const welcome = document.getElementById("userWelcome");
  const login = document.getElementById("loginButton");
  const signup = document.getElementById("signupButton");
  const logout = document.getElementById("logoutButton");

  if (user) {

    welcome.textContent =
      "Welcome, " + (user.displayName || user.email) + "!";

    login.style.display = "none";
    signup.style.display = "none";
    logout.style.display = "inline-block";

  } else {

    welcome.textContent = "";

    login.style.display = "inline-block";
    signup.style.display = "inline-block";
    logout.style.display = "none";

  }

});

</script>

<!-- DARK MODE -->

<script>

document.addEventListener("DOMContentLoaded", function() {

  const themeButton = document.getElementById("themeToggle");

  if (!themeButton) return;

  function applyTheme(isDark) {

    if (isDark) {

      document.body.classList.add("dark-mode");
      themeButton.innerHTML = "☀️ Light Mode";

      localStorage.setItem("theme", "dark");

    } else {

      document.body.classList.remove("dark-mode");
      themeButton.innerHTML = "🌙 Dark Mode";

      localStorage.setItem("theme", "light");

    }

  }

  applyTheme(localStorage.getItem("theme") === "dark");

  themeButton.addEventListener("click", function() {

    const isDark = document.body.classList.contains("dark-mode");

    applyTheme(!isDark);

  });

});

</script>

<!-- LOCATION -->

<script>

async function getLocation() {

  const locationText = document.getElementById("locationText");

  locationText.innerHTML = "Finding location...";

  if (!navigator.geolocation) {

    locationText.innerHTML = "Geolocation is not supported by your browser.";
    return;

  }

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      locationText.innerHTML = "GPS detected! Getting address...";

      try {

        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`
        );

        if (!response.ok) {
          throw new Error("Address lookup failed");
        }

        const data = await response.json();

        locationText.innerHTML =
          "📍 " + (data.display_name || "Address not found");

      } catch (error) {

        locationText.innerHTML =
          "GPS found, but address lookup failed.";

      }

    },

    function(error) {

      if (error.code === 1) {
        locationText.innerHTML = "Location permission denied.";
      } else if (error.code === 2) {
        locationText.innerHTML = "Location unavailable.";
      } else {
        locationText.innerHTML = "Location request timed out.";
      }

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
