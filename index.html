<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANJEEV - Food Delivery</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f7f7f7;
  color: #222;
  transition: 0.3s;
}

body.dark-mode {
  background: #121212;
  color: white;
}

header {
  background: #e23744;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 6px;
}

button {
  cursor: pointer;
}

body.dark-mode header,
body.dark-mode .food,
body.dark-mode .cart,
body.dark-mode .search,
body.dark-mode .categories,
body.dark-mode .track-section,
body.dark-mode .modal,
body.dark-mode .profile-bar,
body.dark-mode .profile-dropdown {
  background: #222;
  color: white;
}

body.dark-mode p,
body.dark-mode h2,
body.dark-mode h3 {
  color: white;
}

body.dark-mode input {
  background: #333;
  color: white;
  border: 1px solid #555;
}

body.dark-mode .categories button {
  background: #333;
  color: white;
}

body.dark-mode .categories button.active {
  background: #e23744;
  color: white;
}

body.dark-mode footer {
  background: #000;
  color: white;
}

body.dark-mode .food p {
  color: #bbb;
}

body.dark-mode .profile-dropdown button {
  color: white;
}

body.dark-mode .profile-dropdown button:hover {
  background: #333;
}

body.dark-mode .bill-details {
  background: #333;
}

body.dark-mode .cart-item {
  border-color: #555;
}

/* HEADER BUTTONS */

#themeToggle,
#locationButton {
  padding: 10px 18px;
  margin: 10px;
  border: none;
  border-radius: 20px;
}

#themeToggle {
  background: #222;
  color: white;
}

#locationButton {
  background: white;
  color: #e23744;
}

#locationText {
  margin: 10px;
  word-wrap: break-word;
}

/* PROFILE */

.profile-container {
  position: relative;
  display: inline-block;
  margin-top: 15px;
}

.profile-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 15px;
  background: white;
  color: #222;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 2px 8px #0002;
}

.profile-avatar {
  width: 40px;
  height: 40px;
  background: #e23744;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.profile-info {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.profile-info span {
  font-weight: bold;
}

.profile-info small {
  font-size: 12px;
  color: gray;
}

.dropdown-arrow {
  margin-left: 10px;
  font-size: 12px;
}

.profile-dropdown {
  display: none;
  position: absolute;
  right: 0;
  top: 110%;
  width: 220px;
  background: white;
  color: #222;
  border-radius: 12px;
  box-shadow: 0 5px 20px #0003;
  z-index: 2000;
  overflow: hidden;
  text-align: left;
}

.profile-dropdown.show {
  display: block;
}

.profile-dropdown button {
  width: 100%;
  padding: 14px;
  border: none;
  background: transparent;
  color: #222;
  text-align: left;
  font-size: 15px;
}

.profile-dropdown button:hover {
  background: #f2f2f2;
}

.logout-option {
  color: #e23744 !important;
  border-top: 1px solid #eee !important;
}

/* AUTH */

#authButtons {
  margin-top: 15px;
}

#loginButton,
#signupButton {
  padding: 10px 20px;
  margin: 5px;
  border: none;
  border-radius: 5px;
}

/* SEARCH */

.search {
  padding: 20px;
  text-align: center;
}

.search input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

/* CATEGORIES */

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 15px;
}

.categories button {
  padding: 11px 17px;
  border: none;
  border-radius: 20px;
  background: white;
  white-space: nowrap;
}

.categories button.active {
  background: #e23744;
  color: white;
}

/* FOOD */

h2 {
  margin: 20px;
}

.food-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  padding: 15px;
}

.food {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px #ddd;
}

.food img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.food-info {
  padding: 12px;
}

.food h3 {
  font-size: 16px;
}

.food p {
  color: #666;
  margin: 8px 0;
  font-size: 13px;
}

.price {
  color: #e23744;
  font-weight: bold;
}

.food button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #e23744;
  color: white;
  border-radius: 7px;
  margin-top: 10px;
}

/* ADVANCED CART */

.cart {
  background: white;
  margin: 15px;
  padding: 18px;
  border-radius: 12px;
}

.cart h2 {
  margin: 0 0 15px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid #ddd;
  gap: 10px;
}

.cart-item-info {
  flex: 1;
}

.cart-item-info h4 {
  margin-bottom: 5px;
}

.cart-item-info p {
  font-size: 13px;
  color: #777;
}

.quantity-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantity-controls button {
  width: 30px;
  height: 30px;
  border: none;
  background: #e23744;
  color: white;
  border-radius: 5px;
}

.remove-btn {
  background: #dc3545;
  color: white;
  border: none;
  padding: 7px 10px;
  border-radius: 5px;
}

.coupon-box {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.coupon-box input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.coupon-box button {
  background: #28a745;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
}

.bill-details {
  background: #f8f8f8;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
}

.bill-details p {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.checkout {
  width: 100%;
  padding: 15px;
  background: #e23744;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 15px;
}

/* TRACK */

.track-section {
  background: white;
  padding: 25px;
  margin: 20px;
  border-radius: 15px;
}

.track-section input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

.track-section button {
  width: 100%;
  padding: 12px;
  background: #e23744;
  color: white;
  border: none;
  border-radius: 8px;
}

/* MODALS */

.modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 85%;
  max-width: 350px;
  box-shadow: 0 0 20px #999;
  z-index: 1000;
}

.modal h2 {
  color: #e23744;
  margin: 0 0 15px;
}

.modal input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

.modal button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}

.formButton {
  background: #e23744;
  color: white;
}

.closeButton {
  background: #ddd;
  color: black;
}

/* FOOTER */

footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 30px;
}

/* MOBILE */

@media (max-width: 400px) {

  .food-list {
    grid-template-columns: 1fr;
  }

  .profile-dropdown {
    width: 200px;
  }

  .cart-item {
    flex-wrap: wrap;
  }

}
</style>
</head>

<body>

<header>

  <h1>SANJEEV</h1>
  <p>Delicious Food, Delivered To You!</p>

  <button id="themeToggle">
    🌙 Dark Mode
  </button>

  <button id="locationButton" onclick="getLocation()">
    📍 My Location
  </button>

  <p id="locationText"></p>

  <!-- PROFILE -->

  <div class="profile-container">

    <div id="profileBar"
         class="profile-bar"
         style="display:none;"
         onclick="toggleProfileMenu()">

      <div class="profile-avatar">👤</div>

      <div class="profile-info">

        <span id="profileName">User</span>

        <small id="profileEmail">Email</small>

      </div>

      <span class="dropdown-arrow">▼</span>

    </div>

    <div id="profileDropdown" class="profile-dropdown">

      <button onclick="showProfile()">👤 My Profile</button>
      <button onclick="showOrders()">📦 My Orders</button>
      <button onclick="showAddresses()">📍 Saved Addresses</button>
      <button onclick="showFavorites()">❤️ Favorites</button>
      <button onclick="showSettings()">⚙️ Settings</button>

      <button id="dropdownLogout" class="logout-option">
        🚪 Logout
      </button>

    </div>

    <div id="authButtons">

      <button id="loginButton"
        onclick="openForm('login')"
        style="background:white;color:#e23744;">

        Login

      </button>

      <button id="signupButton"
        onclick="openForm('signup')"
        style="background:#222;color:white;">

        Signup

      </button>

    </div>

  </div>

  <p id="userWelcome" style="margin-top:10px;font-weight:bold;"></p>

</header>

<!-- SEARCH -->

<section class="search">

  <input
    id="search"
    type="text"
    placeholder="Search your favourite food..."
    oninput="showFoods()">

</section>

<!-- CATEGORIES -->

<div class="categories">

  <button class="active" onclick="filterFood('All',this)">All</button>
  <button onclick="filterFood('Biryani',this)">Biryani</button>
  <button onclick="filterFood('Pizza',this)">Pizza</button>
  <button onclick="filterFood('Burger',this)">Burger</button>
  <button onclick="filterFood('Dosa',this)">Dosa</button>

</div>

<h2>Popular Food</h2>

<div class="food-list" id="foodList"></div>

<!-- ADVANCED CART -->

<section class="cart">

  <h2>🛒 Your Cart</h2>

  <div id="cartItems"></div>

  <div class="coupon-box">

    <input
      type="text"
      id="couponInput"
      placeholder="Enter coupon code">

    <button onclick="applyCoupon()">Apply</button>

  </div>

  <p id="couponMessage"></p>

  <div class="bill-details">

    <p>
      Item Total:
      <span id="subtotal">₹0</span>
    </p>

    <p>
      Delivery Fee:
      <span id="deliveryFee">₹0</span>
    </p>

    <p>
      Platform Fee:
      <span id="platformFee">₹0</span>
    </p>

    <p>
      Discount:
      <span id="discount">₹0</span>
    </p>

    <hr>

    <h3 style="display:flex;justify-content:space-between;margin-top:15px;">
      Grand Total:
      <span id="grandTotal">₹0</span>
    </h3>

  </div>

  <button class="checkout" onclick="checkout()">
    Proceed to Checkout
  </button>

</section>

<!-- LOGIN -->

<div id="loginForm" class="modal">

  <h2>Login</h2>

  <input type="email" id="loginEmail" placeholder="Email">

  <input type="password" id="loginPassword" placeholder="Password">

  <button id="loginBtn" class="formButton">Login</button>

  <button onclick="closeForm()" class="closeButton">Close</button>

</div>

<!-- SIGNUP -->

<div id="signupForm" class="modal">

  <h2>Signup</h2>

  <input type="text" id="signupName" placeholder="Full Name">

  <input type="email" id="signupEmail" placeholder="Email">

  <input type="password" id="signupPassword" placeholder="Password">

  <button id="signupBtn" class="formButton">Create Account</button>

  <button onclick="closeForm()" class="closeButton">Cancel</button>

</div>

<!-- ORDER TRACKING -->

<section class="track-section">

  <h2 style="color:#e23744;text-align:center;">
    Track Your Order 🚚
  </h2>

  <input type="text" id="orderId" placeholder="Enter Order ID">

  <button onclick="trackOrder()">Track Order</button>

  <div id="trackingResult" style="margin-top:20px;"></div>

</section>

<footer>

  <h3>SANJEEV</h3>

  <p>Food Delivery Website</p>

  <p>© 2026 SANJEEV. All rights reserved.</p>

</footer>

<script>

/* FOOD DATA */

const foods = [

  {
    name: "Chicken Biryani",
    category: "Biryani",
    price: 160,
    image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=500"
  },

  {
    name: "Veg Biryani",
    category: "Biryani",
    price: 120,
    image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=500"
  },

  {
    name: "Cheese Pizza",
    category: "Pizza",
    price: 199,
    image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"
  },

  {
    name: "Burger",
    category: "Burger",
    price: 99,
    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
  },

  {
    name: "Masala Dosa",
    category: "Dosa",
    price: 70,
    image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=500"
  },

  {
    name: "Paneer Pizza",
    category: "Pizza",
    price: 179,
    image: "https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?w=500"
  }

];


/* CART DATA */

let selected = "All";

let cart = JSON.parse(localStorage.getItem("sanjeevCart")) || [];

let appliedCoupon = localStorage.getItem("sanjeevCoupon") || "";


/* DISPLAY FOOD */

function showFoods() {

  const search = document
    .getElementById("search")
    .value.toLowerCase();

  const filtered = foods.filter(food =>

    (selected === "All" || food.category === selected) &&
    food.name.toLowerCase().includes(search)

  );

  document.getElementById("foodList").innerHTML =

    filtered.map(food => `

      <div class="food">

        <img src="${food.image}" alt="${food.name}">

        <div class="food-info">

          <h3>${food.name}</h3>

          <p>${food.category}</p>

          <div class="price">₹${food.price}</div>

          <button onclick="addCart('${food.name}')">
            Add to Cart +
          </button>

        </div>

      </div>

    `).join("") || "<p>No food found.</p>";

}


/* FILTER FOOD */

function filterFood(category, button) {

  selected = category;

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  showFoods();

}


/* ADD TO CART */

function addCart(name) {

  const food = foods.find(item => item.name === name);

  if (!food) return;

  const existingItem = cart.find(item => item.name === name);

  if (existingItem) {

    existingItem.quantity++;

  } else {

    cart.push({
      name: food.name,
      price: food.price,
      quantity: 1
    });

  }

  saveCart();

  updateCart();

}


/* INCREASE QUANTITY */

function increaseQty(index) {

  cart[index].quantity++;

  saveCart();

  updateCart();

}


/* DECREASE QUANTITY */

function decreaseQty(index) {

  cart[index].quantity--;

  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }

  saveCart();

  updateCart();

}


/* REMOVE ITEM */

function removeItem(index) {

  cart.splice(index, 1);

  saveCart();

  updateCart();

}


/* SAVE CART */

function saveCart() {

  localStorage.setItem(
    "sanjeevCart",
    JSON.stringify(cart)
  );

}


/* COUPON SYSTEM */

function applyCoupon() {

  const coupon = document
    .getElementById("couponInput")
    .value.trim()
    .toUpperCase();

  const subtotal = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  const message = document.getElementById("couponMessage");

  if (coupon === "SAVE50" && subtotal >= 300) {

    appliedCoupon = "SAVE50";

    message.innerHTML = "✅ ₹50 discount applied!";

    message.style.color = "green";

  }

  else if (coupon === "WELCOME10" && subtotal >= 200) {

    appliedCoupon = "WELCOME10";

    message.innerHTML = "✅ 10% discount applied!";

    message.style.color = "green";

  }

  else {

    appliedCoupon = "";

    message.innerHTML =
      "❌ Invalid coupon or minimum order not reached.";

    message.style.color = "red";

  }

  localStorage.setItem("sanjeevCoupon", appliedCoupon);

  updateCart();

}


/* UPDATE CART */

function updateCart() {

  const cartItems = document.getElementById("cartItems");

  let subtotal = 0;

  if (cart.length === 0) {

    cartItems.innerHTML = `

      <div style="text-align:center;padding:30px;">

        <h3>🛒 Your Cart is Empty</h3>

        <p>Add delicious food to get started!</p>

      </div>

    `;

    document.getElementById("subtotal").innerText = "₹0";

    document.getElementById("deliveryFee").innerText = "₹0";

    document.getElementById("platformFee").innerText = "₹0";

    document.getElementById("discount").innerText = "₹0";

    document.getElementById("grandTotal").innerText = "₹0";

    document.getElementById("couponMessage").innerText = "";

    appliedCoupon = "";

    localStorage.removeItem("sanjeevCoupon");

    return;

  }


  cartItems.innerHTML = "";

  cart.forEach((item, index) => {

    const itemTotal = item.price * item.quantity;

    subtotal += itemTotal;

    cartItems.innerHTML += `

      <div class="cart-item">

        <div class="cart-item-info">

          <h4>${item.name}</h4>

          <p>₹${item.price} × ${item.quantity}</p>

          <strong>₹${itemTotal}</strong>

        </div>

        <div class="quantity-controls">

          <button onclick="decreaseQty(${index})">−</button>

          <span>${item.quantity}</span>

          <button onclick="increaseQty(${index})">+</button>

        </div>

        <button class="remove-btn"
                onclick="removeItem(${index})">

          Remove

        </button>

      </div>

    `;

  });


  /* DELIVERY FEE */

  let deliveryFee = subtotal >= 499 ? 0 : 30;


  /* PLATFORM FEE */

  let platformFee = 5;


  /* DISCOUNT */

  let discount = 0;

  if (appliedCoupon === "SAVE50" && subtotal >= 300) {

    discount = 50;

  }

  else if (appliedCoupon === "WELCOME10" && subtotal >= 200) {

    discount = Math.round(subtotal * 0.10);

  }

  else if (appliedCoupon) {

    appliedCoupon = "";

    localStorage.removeItem("sanjeevCoupon");

  }


  /* TOTAL */

  let grandTotal =
    subtotal + deliveryFee + platformFee - discount;


  document.getElementById("subtotal").innerText =
    "₹" + subtotal;

  document.getElementById("deliveryFee").innerText =
    deliveryFee === 0 ? "FREE" : "₹" + deliveryFee;

  document.getElementById("platformFee").innerText =
    "₹" + platformFee;

  document.getElementById("discount").innerText =
    "₹" + discount;

  document.getElementById("grandTotal").innerText =
    "₹" + grandTotal;

}


/* CHECKOUT */

function checkout() {

  if (!cart.length) {

    alert("Please add food to your cart first!");

    return;

  }

  const name = prompt("Enter your full name:");

  if (!name || !name.trim()) return;


  const phone = prompt("Enter your 10-digit mobile number:");

  if (!phone || !/^[6-9]\d{9}$/.test(phone.trim())) {

    alert("Enter a valid mobile number.");

    return;

  }


  const address = prompt("Enter your delivery address:");

  if (!address || !address.trim()) return;


  const subtotal = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  const deliveryFee = subtotal >= 499 ? 0 : 30;

  const platformFee = 5;

  let discount = 0;

  if (appliedCoupon === "SAVE50" && subtotal >= 300) {

    discount = 50;

  }

  else if (appliedCoupon === "WELCOME10" && subtotal >= 200) {

    discount = Math.round(subtotal * 0.10);

  }


  const total = subtotal + deliveryFee + platformFee - discount;


  const orderDetails = cart.map(item =>
    `${item.name} × ${item.quantity} = ₹${item.price * item.quantity}`
  ).join("\n");


  const confirmed = confirm(

    "SANJEEV ORDER\n\n" +

    "Name: " + name +

    "\nPhone: " + phone +

    "\nAddress: " + address +

    "\n\n" + orderDetails +

    "\n\nSubtotal: ₹" + subtotal +

    "\nDelivery: ₹" + deliveryFee +

    "\nPlatform Fee: ₹" + platformFee +

    "\nDiscount: ₹" + discount +

    "\nTotal: ₹" + total +

    "\n\nConfirm order?"

  );


  if (confirmed) {

    const orderID = "SJ" + Date.now();

    alert(

      "Order placed successfully!\n\n" +

      "Order ID: " + orderID +

      "\nTotal: ₹" + total +

      "\n\nThank you " + name + "!"

    );

    cart = [];

    appliedCoupon = "";

    localStorage.removeItem("sanjeevCoupon");

    saveCart();

    updateCart();

  }

}


/* INITIALIZE */

showFoods();

updateCart();

</script>

<!-- LOGIN / SIGNUP -->

<script>

function openForm(type) {

  document.getElementById("loginForm").style.display = "none";

  document.getElementById("signupForm").style.display = "none";

  i
