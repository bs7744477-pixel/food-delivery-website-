
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANJEEV - Food Delivery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f7f7;
    color: #222;
    transition: 0.3s;
}

/* DARK MODE */

body.dark-mode {
    background: #121212;
    color: white;
}

body.dark-mode header,
body.dark-mode .food,
body.dark-mode .cart,
body.dark-mode .search,
body.dark-mode .categories,
body.dark-mode .track-section,
body.dark-mode .modal,
body.dark-mode .profile-bar,
body.dark-mode .profile-dropdown {
    background: #222;
    color: white;
}

body.dark-mode p,
body.dark-mode h2,
body.dark-mode h3 {
    color: white;
}

body.dark-mode input {
    background: #333;
    color: white;
    border: 1px solid #555;
}

body.dark-mode .categories button {
    background: #333;
    color: white;
}

body.dark-mode .categories button.active {
    background: #e23744;
    color: white;
}

body.dark-mode footer {
    background: #000;
    color: white;
}

body.dark-mode .food p {
    color: #bbb;
}

body.dark-mode .profile-dropdown button {
    color: white;
}

body.dark-mode .profile-dropdown button:hover {
    background: #333;
}

body.dark-mode .modal .closeButton {
    background: #444;
    color: white;
}

/* HEADER */

header {
    background: #e23744;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    font-size: 30px;
}

header p {
    margin-top: 6px;
}

button {
    cursor: pointer;
}

#themeToggle {
    padding: 10px 18px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    background: #222;
    color: white;
}

#locationButton {
    padding: 10px 18px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    background: white;
    color: #e23744;
}

#locationText {
    margin: 10px;
    word-wrap: break-word;
}

/* PROFILE */

.profile-container {
    position: relative;
    display: inline-block;
    margin-top: 15px;
}

.profile-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
    background: white;
    color: #222;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 2px 8px #0002;
}

.profile-avatar {
    width: 40px;
    height: 40px;
    background: #e23744;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.profile-info {
    display: flex;
    flex-direction: column;
    text-align: left;
}

.profile-info span {
    font-weight: bold;
}

.profile-info small {
    font-size: 12px;
    color: gray;
}

.dropdown-arrow {
    margin-left: 10px;
    font-size: 12px;
}

.profile-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 110%;
    width: 220px;
    background: white;
    color: #222;
    border-radius: 12px;
    box-shadow: 0 5px 20px #0003;
    z-index: 2000;
    overflow: hidden;
    text-align: left;
}

.profile-dropdown.show {
    display: block;
}

.profile-dropdown button {
    width: 100%;
    padding: 14px;
    border: none;
    background: transparent;
    color: #222;
    text-align: left;
    font-size: 15px;
}

.profile-dropdown button:hover {
    background: #f2f2f2;
}

.logout-option {
    color: #e23744 !important;
    border-top: 1px solid #eee !important;
}

/* AUTH BUTTONS */

#authButtons {
    margin-top: 15px;
}

#loginButton,
#signupButton {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 5px;
}

/* SEARCH */

.search {
    padding: 20px;
    text-align: center;
}

.search input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

/* CATEGORIES */

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 10px 15px;
}

.categories button {
    padding: 11px 17px;
    border: none;
    border-radius: 20px;
    background: white;
    white-space: nowrap;
}

.categories button.active {
    background: #e23744;
    color: white;
}

/* FOOD */

h2 {
    margin: 20px;
}

.food-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 15px;
}

.food {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px #ddd;
}

.food img {
    width: 100%;
    height: 125px;
    object-fit: cover;
}

.food-info {
    padding: 12px;
}

.food h3 {
    font-size: 16px;
}

.food p {
    color: #666;
    margin: 8px 0;
    font-size: 13px;
}

.price {
    color: #e23744;
    font-weight: bold;
}

.food button,
.checkout {
    width: 100%;
    padding: 10px;
    border: none;
    background: #e23744;
    color: white;
    border-radius: 7px;
    margin-top: 10px;
}

/* CART */

.cart {
    background: white;
    margin: 15px;
    padding: 18px;
    border-radius: 12px;
}

.cart p {
    margin: 10px 0;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
    gap: 10px;
}

.cart-item button {
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    background: #e23744;
    color: white;
    margin: 2px;
}

.cart-total {
    margin-top: 15px;
    font-weight: bold;
    font-size: 20px;
}

/* TRACK ORDER */

.track-section {
    background: white;
    padding: 25px;
    margin: 20px;
    border-radius: 15px;
}

.track-section input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
}

.track-section button {
    width: 100%;
    padding: 12px;
    background: #e23744;
    color: white;
    border: none;
    border-radius: 8px;
}

/* MODALS */

.modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 85%;
    max-width: 350px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 0 20px #999;
    z-index: 1000;
}

.modal h2 {
    color: #e23744;
    margin: 0 0 15px;
}

.modal input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
}

.modal button {
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
}

.formButton {
    background: #e23744;
    color: white;
}

.closeButton {
    background: #ddd;
    color: black;
}

#recaptcha-container {
    margin-top: 10px;
}

/* FOOTER */

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

footer p {
    margin: 8px;
}

/* MOBILE */

@media (max-width: 400px) {

    .food-list {
        grid-template-columns: 1fr;
    }

    .profile-dropdown {
        width: 200px;
    }

    .cart-item {
        flex-wrap: wrap;
    }

}
</style>
</head>

<body>

<header>

    <h1>SANJEEV</h1>
    <p>Delicious Food, Delivered To You!</p>

    <button id="themeToggle">
        🌙 Dark Mode
    </button>

    <button id="locationButton" onclick="getLocation()">
        📍 My Location
    </button>

    <p id="locationText"></p>

    <!-- PROFILE -->

    <div class="profile-container">

        <div id="profileBar"
             class="profile-bar"
             style="display:none;"
             onclick="toggleProfileMenu()">

            <div class="profile-avatar">👤</div>

            <div class="profile-info">

                <span id="profileName">User</span>

                <small id="profileEmail">Email</small>

            </div>

            <span class="dropdown-arrow">▼</span>

        </div>

        <!-- PROFILE DROPDOWN -->

        <div id="profileDropdown" class="profile-dropdown">

            <button onclick="showProfile()">
                👤 My Profile
            </button>

            <button onclick="showOrders()">
                📦 My Orders
            </button>

            <button onclick="showAddresses()">
                📍 Saved Addresses
            </button>

            <button onclick="showFavorites()">
                ❤️ Favorites
            </button>

            <button onclick="showSettings()">
                ⚙️ Settings
            </button>

            <button id="dropdownLogout" class="logout-option">
                🚪 Logout
            </button>

        </div>

        <!-- LOGIN AND SIGNUP -->

        <div id="authButtons">

            <button id="loginButton"
                onclick="openForm('login')"
                style="background:white;color:#e23744;">

                Login

            </button>

            <button id="signupButton"
                onclick="openForm('signup')"
                style="background:#222;color:white;">

                Signup

            </button>

        </div>

    </div>

    <p id="userWelcome" style="margin-top:10px;font-weight:bold;"></p>

</header>

<!-- SEARCH -->

<section class="search">

    <input
        id="search"
        type="text"
        placeholder="Search your favourite food..."
        oninput="showFoods()">

</section>

<!-- CATEGORIES -->

<div class="categories">

    <button class="active" onclick="filterFood('All',this)">All</button>

    <button onclick="filterFood('Biryani',this)">Biryani</button>

    <button onclick="filterFood('Pizza',this)">Pizza</button>

    <button onclick="filterFood('Burger',this)">Burger</button>

    <button onclick="filterFood('Dosa',this)">Dosa</button>

</div>

<h2>Popular Food</h2>

<div class="food-list" id="foodList"></div>

<!-- CART -->

<section class="cart">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems">
        Your cart is empty.
    </div>

    <p>Total: ₹<span id="total">0</span></p>

    <button class="checkout" onclick="checkout()">
        Place Order
    </button>

</section>

<!-- LOGIN FORM -->

<div id="loginForm" class="modal">

    <h2>Login</h2>

    <input type="email" id="loginEmail" placeholder="Email">

    <input type="password" id="loginPassword" placeholder="Password">

    <button id="loginBtn" class="formButton">Login</button>

    <button onclick="closeForm()" class="closeButton">Close</button>

</div>

<!-- SIGNUP FORM -->

<div id="signupForm" class="modal">

    <h2>Signup</h2>

    <input type="text" id="signupName" placeholder="Full Name">

    <input type="email" id="signupEmail" placeholder="Email">

    <input type="password" id="signupPassword" placeholder="Password">

    <button id="signupBtn" class="formButton">Create Account</button>

    <button onclick="closeForm()" class="closeButton">Cancel</button>

</div>

<!-- ORDER TRACKING -->

<section class="track-section">

    <h2 style="color:#e23744;text-align:center;">
        Track Your Order 🚚
    </h2>

    <input type="text" id="orderId" placeholder="Enter Order ID">

    <button onclick="trackOrder()">Track Order</button>

    <div id="trackingResult" style="margin-top:20px;"></div>

</section>

<!-- PHONE OTP VERIFICATION -->

<div id="otpForm" class="modal">

    <h2>📱 Verify Mobile Number</h2>

    <input
        type="tel"
        id="otpPhone"
        placeholder="+91 9876543210">

    <button id="sendOtpBtn" class="formButton">
        Send OTP
    </button>

    <div id="otpSection" style="display:none;">

        <input
            type="text"
            id="otpCode"
            placeholder="Enter 6-digit OTP"
            maxlength="6">

        <button id="verifyOtpBtn" class="formButton">
            Verify OTP
        </button>

    </div>

    <button onclick="closeOtpForm()" class="closeButton">
        Cancel
    </button>

    <div id="recaptcha-container"></div>

</div>

<!-- FOOTER -->

<footer>

    <h3>SANJEEV</h3>

    <p>Food Delivery Website</p>

    <p>© 2026 SANJEEV. All rights reserved.</p>

</footer>

<!-- FOOD WEBSITE SCRIPT -->

<script>

/* FOOD DATA */

const foods = [

    {
        name: "Chicken Biryani",
        category: "Biryani",
        price: 160,
        image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=500"
    },

    {
        name: "Veg Biryani",
        category: "Biryani",
        price: 120,
        image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=500"
    },

    {
        name: "Cheese Pizza",
        category: "Pizza",
        price: 199,
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"
    },

    {
        name: "Burger",
        category: "Burger",
        price: 99,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
    },

    {
        name: "Masala Dosa",
        category: "Dosa",
        price: 70,
        image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=500"
    },

    {
        name: "Paneer Pizza",
        category: "Pizza",
        price: 179,
        image: "https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?w=500"
    }

];

let selected = "All";
let cart = [];

/* DISPLAY FOOD */

function showFoods() {

    const search = document
        .getElementById("search")
        .value.toLowerCase();

    const filtered = foods.filter(food =>

        (selected === "All" ||
            food.category === selected) &&

        food.name.toLowerCase().includes(search)

    );

    document.getElementById("foodList").innerHTML =

        filtered.map(food => `

            <div class="food">

                <img src="${food.image}" alt="${food.name}">

                <div class="food-info">

                    <h3>${food.name}</h3>

                    <p>${food.category}</p>

                    <div class="price">₹${food.price}</div>

                    <button onclick="addCart('${food.name}')">
                        Add to Cart +
                    </button>

                </div>

            </div>

        `).join("") || "<p>No food found.</p>";

}

/* FILTER FOOD */

function filterFood(category, button) {

    selected = category;

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    showFoods();

}

/* ADD TO CART */

function addCart(name) {

    const food = foods.find(item => item.name === name);

    if (food) {

        cart.push(food);

        updateCart();

        alert(food.name + " added to cart!");

    }

}

/* UPDATE CART */

function updateCart() {

    let total = 0;

    document.getElementById("cartItems").innerHTML =

        cart.length

            ? cart.map(food => {

                total += food.price;

                return `<p>${food.name} - ₹${food.price}</p>`;

            }).join("")

            : "Your cart is empty.";

    document.getElementById("total").textContent = total;

}

/* CHECKOUT */

function checkout() {

    if (!cart.length) {

        alert("Please add food to your cart first!");

        return;

    }

    const name = prompt("Enter your full name:");

    if (!name || !name.trim()) return;

    const address = prompt("Enter your delivery address:");

    if (!address || !address.trim()) return;

    window.pendingOrder = {

        name: name.trim(),

        address: address.trim(),

        total: cart.reduce((sum, food) => sum + food.price, 0),

        items: cart.map(food => food.name)

    };

    document.getElementById("otpForm").style.display = "block";

}

/* COMPLETE ORDER AFTER OTP */

window.completeCheckout = function(phone) {

    const order = window.pendingOrder;

    if (!order) return;

    const orderId = "SJ" + Date.now().toString().slice(-6);

    alert(

        "ORDER CONFIRMED!\n\n" +

        "Order ID: " + orderId +

        "\nName: " + order.name +

        "\nPhone: " + phone +

        "\nAddress: " + order.address +

        "\nItems: " + order.items.join(", ") +

        "\nTotal: ₹" + order.total

    );

    document.getElementById("orderId").value = orderId;

    cart = [];

    updateCart();

    window.pendingOrder = null;

    document.getElementById("otpForm").style.display = "none";

    document.getElementById("otpSection").style.display = "none";

    document.getElementById("otpPhone").value = "";

    document.getElementById("otpCode").value = "";

    document.getElementById("trackingResult").innerHTML = "";

};

/* DARK MODE */

const themeButton = document.getElementById("themeToggle");

function applyTheme(isDark) {

    document.body.classList.toggle("dark-mode", isDark);

    themeButton.innerHTML = isDark
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";

    localStorage.setItem("theme", isDark ? "dark" : "light");

}

/* LOAD SAVED THEME */

applyTheme(localStorage.getItem("theme") === "dark");

/* TOGGLE THEME */

themeButton.addEventListener("click", function() {

    const isDark = document.body.classList.contains("dark-mode");

    applyTheme(!isDark);

});

/* LOCATION */

function getLocation() {

    const locationText = document.getElementById("locationText");

    locationText.innerHTML = "📍 Detecting location...";

    if (!navigator.geolocation) {

        locationText.innerHTML =
            "Location is not supported by your browser.";

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            locationText.innerHTML =

                "📍 Location detected successfully!<br>" +

                "Latitude: " + position.coords.latitude + "<br>" +

                "Longitude: " + position.coords.longitude;

        },

        function(error) {

            if (error.code === 1) {

                locationText.innerHTML =
                    "❌ Please allow location permission.";

            } else if (error.code === 2) {

                locationText.innerHTML =
                    "❌ Location unavailable. Turn on GPS.";

            } else {

                locationText.innerHTML =
                    "❌ Location request timed out. Try again.";

            }

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}

/* DISPLAY FOOD */

showFoods();

</script>

<!-- LOGIN AND SIGNUP FORM CONTROL -->

<script>

function openForm(type) {

    document.getElementById("loginForm").style.display = "none";

    document.getElementById("signupForm").style.display = "none";

    if (type === "login") {

        document.getElementById("loginForm").style.display = "block";

    } else {

        document.getElementById("signupForm").style.display = "block";

    }

}

function closeForm() {

    document.getElementById("loginForm").style.display = "none";

    document.getElementById("signupForm").style.display = "none";

}

/* CLOSE MODAL BY CLICKING OUTSIDE */

document.addEventListener("click", function(event) {

    const loginForm = document.getElementById("loginForm");

    const signupForm = document.getElementById("signupForm");

    if (event.target === loginForm) {

        loginForm.style.display = "none";

    }

    if (event.target === signupForm) {

        signupForm.style.display = "none";

    }

});

/* PROFILE DROPDOWN */

function toggleProfileMenu() {

    document.getElementById("profileDropdown")
        .classList.toggle("show");

}

/* CLOSE MENU WHEN CLICKING OUTSIDE */

document.addEventListener("click", function(event) {

    const container = document.querySelector(".profile-container");

    if (container && !container.contains(event.target)) {

        document.getElementById("profileDropdown")
            .classList.remove("show");

    }

});

/* PROFILE MENU OPTIONS */

function showProfile() {

    alert("My Profile");

}

function showOrders() {

    alert("My Orders");

}

function showAddresses() {

    alert("Saved Addresses");

}

function showFavorites() {

    alert("My Favorites");

}

function showSettings() {

    alert("Settings");

}

/* ORDER TRACKING */

function trackOrder() {

    const id = document
        .getElementById("orderId")
        .value.trim();

    if (!id) {

        alert("Please ente
